name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Publish release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version in manifest.json is a placeholder in git; the release tag
      # is the single source of truth and gets stamped in here.
      - name: Stamp version from tag
        working-directory: custom_components/lamax_connect
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          cat manifest.json

      - name: Build ZIP
        working-directory: custom_components/lamax_connect
        run: zip -r lamax_connect.zip . -x '*.pyc' -x '__pycache__/*'

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          files: custom_components/lamax_connect/lamax_connect.zip
