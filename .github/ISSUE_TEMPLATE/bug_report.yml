name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include diagnostics if you can - Settings > Devices & Services >
        LAMAX Connect > three dots > Download diagnostics. They are redacted of
        credentials, IMEI and coordinates.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.2.0"
    validations:
      required: true
  - type: input
    id: watch
    attributes:
      label: Watch model
      placeholder: "LAMAX WatchY4"
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Enable debug logging first (see the README).
      render: text
